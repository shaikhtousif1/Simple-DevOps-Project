services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: devsecops-lab:local
    container_name: devsecops-lab-web
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
